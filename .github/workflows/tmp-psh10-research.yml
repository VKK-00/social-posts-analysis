name: tmp-psh10-katottg
on:
  push:
    branches: [tmp/psh10-research-20260805]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official KATOTTG workbook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://mindev.gov.ua/storage/app/sites/1/uploaded-files/kodifikator-07-07.xlsx' -o out/katottg_2026-07-07.xlsx
          sha256sum out/katottg_2026-07-07.xlsx > out/SHA256SUMS.txt
          ls -lh out/
      - name: Upload workbook
        uses: actions/upload-artifact@v4
        with:
          name: psh10-katottg-2026-07-07
          path: out/
          if-no-files-found: error
          retention-days: 1
